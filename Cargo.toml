[package]
name = "osx-dek-rs"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "macOS External Disk ClamAV Scanner"

[dependencies]
notify = "8.2.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.21"
tao = "0.34"
image = "0.25"
eframe = "0.30"
rfd = "0.15"
csv = "1.3"
